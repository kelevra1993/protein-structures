[project]
name = "protein-structures"
version = "0.1.0"
description = "Project For Training Alpha Fold II Architecture For Protein Structure Prediction On Nvidia's DGX Spark"
authors = ["Robert Nshimiyimana Kelevra <kelevra.robert@gmail.com>"]
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "numpy>=2.4.6",
    "tqdm >= 4.67.3",
    "torch >= 2.12.0",
    "pytest >= 9.0.3",
    "modelcif >= 1.7",
    "pyyaml >= 6.0.3",
    "gradio >= 6.15.2",
    "matplotlib >= 3.10.9",
    "plotly >= 6.8.0",
    "tensorboard >= 2.20.0",
    "torch-tb-profiler>=0.4.3",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
