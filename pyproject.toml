[tool.poetry]
name = "protein-structures"
version = "0.1.0"
description = "Project For Training Alpha Fold II Architecture For Protein Structure Prediction"
authors = ["Robert Nshimiyimana Kelevra <kelevra.robert@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = "^2.4.5"
tqdm = "^4.67.3"
torch = "^2.12.0"
pytest = "^9.0.3"
modelcif = "^1.7"
pyyaml = "^6.0.3"
gradio = "^6.15.2"
matplotlib = "^3.10.9"
plotly = "^6.8.0"
tensorboard = "^2.20.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
